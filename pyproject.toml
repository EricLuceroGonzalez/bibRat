[project]
name = "biblio-search"
version = "0.1.0"
description = "Un motor de busqueda para repositorios de articulos cientificos"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Eric Lucero Gonzalez", email = "ericlucerog@gmail.com" }]
dependencies = [
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "tenacity==9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pylint>=3",   # incluye pyreverse para diagramas UML
    "pre-commit>=3",
    "responses==0.26.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biblio_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errores y pyflakes · I: orden de imports (reemplaza isort) · UP: sintaxis moderna · B: bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["biblio_search"]

[project.scripts]
biblio-search = "biblio_search.__main__:main"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # fixtures con XML/JSON largos
